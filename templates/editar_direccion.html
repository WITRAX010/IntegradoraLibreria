<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Dirección</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 25px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
            text-align: center;
        }

        .form-container {
            background-color: #f8f9fa;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 15px;
        }

        .form-group {
            flex: 1 0 calc(50% - 20px);
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #555;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: #4a90e2;
            outline: none;
            box-shadow: 0 0 4px rgba(74, 144, 226, 0.3);
        }

        .btn {
            display: inline-block;
            background-color: #4a90e2;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.3s;
            text-decoration: none;
            font-size: 14px;
        }

        .btn:hover {
            background-color: #357abd;
        }

        .btn-container {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
        }
        
        .btn-cancel {
            background-color: #6c757d;
        }
        
        .btn-cancel:hover {
            background-color: #5a6268;
        }

        @media (max-width: 768px) {
            .form-group {
                flex: 1 0 100%;
            }
            
            .btn-container {
                flex-direction: column;
                gap: 10px;
            }
            
            .btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo"><a href="{{ url_for('usuarios.cliente_dashboard') }}" style="color: white; text-decoration: none;">LibreriaKOA</a></div>
            <ul class="nav-links">
                <li><a href="{{ url_for('usuarios.cliente_dashboard') }}">Inicio</a></li>
                <li><a href="{{ url_for('usuarios.carrito') }}">Carrito</a></li>
                <li><a href="{{ url_for('usuarios.mis_pedidos') }}">Mis Pedidos</a></li>
                <li><a href="{{ url_for('usuarios.direcciones') }}">Mis Direcciones</a></li>
                <li><a href="{{ url_for('usuarios.configuracion') }}">Mi Cuenta</a></li>
                <li><a href="/login">Cerrar sesión</a></li>
            </ul>
        </nav>
    </header>
    <div class="container">
        <h1>Editar Dirección</h1>
        <div class="form-container">
            <form method="POST">
                <div class="form-row">
                    <div class="form-group">
                        <label for="calle">Calle</label>
                        <input type="text" id="calle" name="calle" value="{{ direccion.Calle }}" required>
                    </div>
                    <div class="form-group">
                        <label for="colonia">Colonia</label>
                        <input type="text" id="colonia" name="colonia" value="{{ direccion.Colonia }}" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="pais">País</label>
                        <input type="text" id="pais" name="pais" value="{{ direccion.Pais }}" required>
                    </div>
                    <div class="form-group">
                        <label for="ciudad">Ciudad</label>
                        <input type="text" id="ciudad" name="ciudad" value="{{ direccion.Ciudad }}" required>
                    </div>
                </div>
                <div class="btn-container">
                    <a href="{{ url_for('usuarios.direcciones') }}" class="btn btn-cancel">Cancelar</a>
                    <button type="submit" class="btn">Actualizar Dirección</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
